# SafeFlow Policy architecture config for learning/train_dagger.py -- Franka FR3 arm (OMPL + CasADi expert)
model:
  policy_type: safeflow         # options: flow, safeflow

  flow:
    num_inference_steps: 5      # Euler integration steps for ODE sampling

  # Only used by the safeflow policy
  safeflow:
    init: previous_safe         # where the flow integration starts: previous_safe (last safe actions, shifted) or gaussian

  # The policy predicts a chunk of prediction_horizon jerks per state (DAgger labels it with the expert's plan)
  prediction_horizon: 10
  unet:
    dim: 32                     # base channel count (a multiple of 8)
    dim_mults: [1, 2]           # channel multipliers of the levels; every level but the first halves the horizon

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 4        # one round at beta 1: the expert's rollouts only, like SafeFlowMPC's pretraining
  trajectories_per_iteration: [1000, 1000, 1000, 1000]
  steps_per_trajectory: 100
  target_epochs_per_round: [50, 50, 50, 50]
  action_noise_std: 0.0         # rad/s^3, Gaussian noise on the executed jerk
  expert_beta_per_iteration: [0.80, 0.4, 0.2, 0.0]
  eval_episodes: 100
  tolerance_overrides:
    pos_tol: 0.05
    vel_tol: 0.02
  # Deliberately more relaxed than tolerance_overrides above, falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    pos_tol: 0.3
    vel_tol: 0.01
  num_workers: 4

