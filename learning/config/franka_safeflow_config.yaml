# SafeFlow Policy architecture config for learning/train_dagger.py -- Franka FR3 arm
model:
  policy_type: safeflow         # options: flow, safeflow

  flow:
    num_inference_steps: 7      # Euler integration steps for ODE sampling
    history_length: 10          # last positions of the arm (the current one last) the policy is conditioned on

  # Only used by the safeflow policy
  safeflow:
    init: previous_safe         # where the flow integration starts: previous_safe (last safe actions, shifted) or gaussian

  # The policy predicts a chunk of prediction_horizon joint positions per state (DAgger labels it with the expert's plan)
  prediction_horizon: 16
  execution_horizon: 8          # control periods the first jerks of the chunk are executed for before the policy is asked again
  unet:
    dim: 32                     # base channel count (a multiple of 8)
    dim_mults: [1, 2, 4, 8]     # channel multipliers of the levels; every level but the first halves the horizon

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 4
  trajectories_per_iteration: [1000, 1000, 1000, 1000]
  steps_per_trajectory: 100
  target_epochs_per_round: [150, 150, 150, 150]
  learning_rate: 1.0e-4         # AdamW; every round decays it by a cosine over twice the round's steps (to 1e-7), and the next round starts afresh
  action_noise_std: 0.0         # rad/s^3, Gaussian noise on the executed jerk
  expert_beta_per_iteration: [1.0, 0.5, 0.0, 0.0]
  eval_episodes: 100
  tolerance_overrides:
    pos_tol: 0.03
    vel_tol: 0.01
  # Deliberately more relaxed than tolerance_overrides above, falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    pos_tol: 0.05
    vel_tol: 0.03
  num_workers: 4

