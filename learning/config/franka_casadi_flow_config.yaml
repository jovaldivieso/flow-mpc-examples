# Flow Policy architecture config for learning/train_dagger.py -- Franka FR3 arm
model:
  policy_type: flow             # options: flow, safeflow

  flow:
    num_inference_steps: 6      # Euler integration steps for ODE sampling

  prediction_horizon: 16
  hidden_dims: [256, 256, 256]  # widths of the hidden layers

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 1
  trajectories_per_iteration: [4000]
  steps_per_trajectory: 250
  target_epochs_per_round: [200]
  action_noise_std: 0.0        # rad/s^3, Gaussian noise on the executed jerk
  expert_mix_beta_start: 1.0
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  # adaptive_beta_recovery: true
  eval_episodes: 100
  tolerance_overrides:
    pos_tol: 0.1
    rot_tol: 0.3
    vel_tol: 0.01
  # Deliberately more relaxed than tolerance_overrides above,
  # falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    pos_tol: 0.1
    rot_tol: 0.3
    vel_tol: 0.01
  # round_seeds: [0, 0, 0]    # base seed per round for random initial-state/goal sampling
  # restart_round_seed: true  # true replays identical draws whenever round_seeds repeats a value
