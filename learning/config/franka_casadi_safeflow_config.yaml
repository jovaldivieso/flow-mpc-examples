# Flow Policy architecture config for learning/train_dagger.py -- Franka FR3 arm
model:
  policy_type: safeflow         # options: flow, safeflow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  # Only used by the safeflow policy
  safeflow:
    init: previous_safe         # where the flow integration starts: previous_safe (last safe actions, shifted) or gaussian
  prediction_horizon: 16
  unet:
    dim: 32                     # base channel count (a multiple of 8)
    dim_mults: [1, 2, 4, 8]     # channel multipliers of the levels; every level but the first halves the horizon

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 2
  trajectories_per_iteration: [4000]
  steps_per_trajectory: 250
  target_epochs_per_round: [20]
  action_noise_std: 0.0        # rad/s^3, Gaussian noise on the executed jerk
  expert_beta_per_iteration: [1.0, 0.75]
  eval_episodes: 100
  tolerance_overrides:
    pos_tol: 0.1
    vel_tol: 0.01
  # Deliberately more relaxed than tolerance_overrides above: collection/
  # training wants precise demonstrations, but eval only cares whether the
  # rollout got close and stayed collision-free, not exact final-pose
  # matching. Falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    pos_tol: 0.1
    vel_tol: 0.01
  # round_seeds: [0, 0, 0]    # base seed per round for random initial-state/goal sampling
  # restart_round_seed: true  # true replays identical draws whenever round_seeds repeats a value
