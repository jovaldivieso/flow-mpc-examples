# Expert (OMPL RRT-Connect path timed by time-optimal trajectory generation) config for the Franka FR3 arm with a table:
# episodes drawn from the modes of 'sampling' below (the learning config's regions restrict them to some of the modes).
# State x = [q (7), v (7), a (7)], action u = joint jerks (7), goal = target TCP pose (position and rotation matrix).
system: franka
dt: 0.1
# Limits of the arm [rad/s^2, rad/s^3]; joint position and velocity limits come from the URDF
max_acceleration: 5.0
max_jerk: 15.0

# The expert planner (planning/planner_factory.py): ompl_casadi, the positions along an OMPL RRT-Connect path timed by
# time-optimal trajectory generation, tracked by the safety projection's jerks
expert: ompl_casadi
# Rows of positions the expert plans per state. DAgger labels a state with the first prediction_horizon (the policy config's
# chunk length, at most this) of them.
horizon: 20

# Settings of the OMPL path and its timing
ompl_timeout: 5.0               # s per RRT-Connect solve
ompl_candidates: 3              # RRT-Connect paths planned per path, the one the end effector travels the shortest along is kept
ompl_seed: 0
replan_distance: 0.5            # rad from the timed path (the learner drove the arm away): plan a new path
progress_window: 1.5            # rad of path length ahead of the arm's progress searched for its nearest point on the path
totg_velocity_scale: 0.8        # fractions of the velocity and acceleration limits the path is timed within
totg_acceleration_scale: 0.5
totg_max_deviation: 0.05        # rad the timed path may cut the corner of a waypoint

# Success: the TCP within pos_tol [m] of the goal position and at rest (vel_tol [rad/s]); the orientation is not tested
pos_tol: 0.03
vel_tol: 0.01

# The projection that tracks the positions (the expert's, and the safeflow policy's): the weights of the derivatives of the
# tracking (the positions weigh 1) as in the authors' safety filter, and of the soft rest at the end of the chunk
projection_velocity_weight: 0.001
projection_acceleration_weight: 0.001
projection_jerk_weight: 0.0001
terminal_velocity_weight: 10.0

# Minimum TCP-to-goal distance [m] of a start
min_start_goal_distance: 0.3

# How an episode is drawn: one mode by weight, then a start configuration and a goal pose in its regions, each a box of TCP
# positions with the hand (tool z-axis) within tool_tilt [rad] of tool_axis (default: between forward and down, tilt 0.9).
# start_speed is the fraction of the joint velocity limits the arm starts with (at random velocities, default 0: at rest).
sampling:
  broad:                        # anywhere in front of the arm
    weight: 0.35
  crossing:                     # from above the table to underneath it, the hand forward
    weight: 0.25
    start: {x: [0.38, 0.56], y: [-0.25, 0.25], z: [0.70, 0.90]}
    goal: {x: [0.38, 0.56], y: [-0.25, 0.25], z: [0.15, 0.34], tool_axis: [1.0, 0.0, 0.0], tool_tilt: 0.4}
  recross:                      # from underneath the table to above it
    weight: 0.10
    start: {x: [0.38, 0.56], y: [-0.25, 0.25], z: [0.15, 0.34], tool_axis: [1.0, 0.0, 0.0], tool_tilt: 0.4}
    goal: {x: [0.38, 0.56], y: [-0.25, 0.25], z: [0.70, 0.90]}
  under:                        # adjustments underneath the table
    weight: 0.10
    start: {x: [0.35, 0.60], y: [-0.40, 0.40], z: [0.15, 0.34], tool_axis: [1.0, 0.0, 0.0], tool_tilt: 0.4}
    goal: {x: [0.35, 0.60], y: [-0.40, 0.40], z: [0.15, 0.34], tool_axis: [1.0, 0.0, 0.0], tool_tilt: 0.4}
  near_table:                   # from just above the table surface to underneath it
    weight: 0.10
    start: {x: [0.30, 0.64], y: [-0.30, 0.30], z: [0.62, 0.75]}
    goal: {x: [0.38, 0.56], y: [-0.25, 0.25], z: [0.15, 0.34], tool_axis: [1.0, 0.0, 0.0], tool_tilt: 0.4}
  moving:                       # anywhere, the arm already in motion
    weight: 0.10
    start_speed: 0.3

# The table: a 2 x 9 grid of spheres (0.14 m apart, at most sqrt(2) radii, so the four spheres of a cell leave no hole), a slab
# 0.2 m thick at z = 0.4 .. 0.6 m, x = 0.30 .. 0.64 m, y = -0.66 .. 0.66 m, its front edge 0.3 m from the base. It is wide
# enough that the arm cannot go down at its sides, only in front of it.
obstacles:
  - position: [0.40, -0.56, 0.50]
    radius: 0.10
  - position: [0.40, -0.42, 0.50]
    radius: 0.10
  - position: [0.40, -0.28, 0.50]
    radius: 0.10
  - position: [0.40, -0.14, 0.50]
    radius: 0.10
  - position: [0.40, 0.00, 0.50]
    radius: 0.10
  - position: [0.40, 0.14, 0.50]
    radius: 0.10
  - position: [0.40, 0.28, 0.50]
    radius: 0.10
  - position: [0.40, 0.42, 0.50]
    radius: 0.10
  - position: [0.40, 0.56, 0.50]
    radius: 0.10
  - position: [0.54, -0.56, 0.50]
    radius: 0.10
  - position: [0.54, -0.42, 0.50]
    radius: 0.10
  - position: [0.54, -0.28, 0.50]
    radius: 0.10
  - position: [0.54, -0.14, 0.50]
    radius: 0.10
  - position: [0.54, 0.00, 0.50]
    radius: 0.10
  - position: [0.54, 0.14, 0.50]
    radius: 0.10
  - position: [0.54, 0.28, 0.50]
    radius: 0.10
  - position: [0.54, 0.42, 0.50]
    radius: 0.10
  - position: [0.54, 0.56, 0.50]
    radius: 0.10

initial_state_seed: 0
action_noise_seed: 0

