# Expert (OMPL RRT-Connect path timed by time-optimal trajectory generation) config for the triple-integrator point mass (a toy system to calibrate the pipeline).
# State x = [p (7), v (7), a (7)], action u = jerks (7), goal = target position.
system: triple_integrator
dimension: 7
dt: 0.1
# Limits of the point mass [m/s, m/s^2, m/s^3]; its position is unbounded
max_velocity: 1.0
max_acceleration: 2.0
max_jerk: 10.0

# The expert planner (planning/planner_factory.py): ompl_casadi, the positions along an OMPL RRT-Connect path timed by
# time-optimal trajectory generation, tracked by the safety projection's jerks
expert: ompl_casadi
# Rows of positions the expert plans per state. DAgger labels a state with the first prediction_horizon (the policy config's
# chunk length, at most this) of them.
horizon: 20

# Settings of the OMPL path and its timing
ompl_timeout: 5.0               # s per RRT-Connect solve
ompl_seed: 0
replan_distance: 0.5            # m from the timed path (the learner drove the point away): plan a new path
progress_window: 1.5            # m of path length ahead of the point's progress searched for its nearest point on the path
totg_velocity_scale: 0.8        # fractions of the velocity and acceleration limits the path is timed within
totg_acceleration_scale: 0.5
totg_max_deviation: 0.05        # m the timed path may cut the corner of a waypoint


# Success: within pos_tol [m] of the goal and at rest (vel_tol [m/s])
pos_tol: 0.02
vel_tol: 0.01

# The projection that tracks the positions (the expert's, and the safeflow policy's): the weights of the derivatives of the
# tracking (the positions weigh 1) as in the authors' safety filter, and of the soft rest at the end of the chunk
projection_velocity_weight: 0.001
projection_acceleration_weight: 0.001
projection_jerk_weight: 0.0001
terminal_velocity_weight: 10.0

# Random start/goal positions: the box [min, max] of every axis, minimum start-goal distance
workspace_bounds: [-1.0, 1.0]
min_start_goal_distance: 0.5

initial_state_seed: 0
action_noise_seed: 0